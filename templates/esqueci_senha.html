<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueceu a senha — HiringEval</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-logo">HiringEval</div>
      <p class="login-subtitle">Recuperar acesso à conta</p>

      {% if enviado %}
        <div style="background:#dcfce7; border:1px solid #bbf7d0; color:#15803d; border-radius:6px; padding:0.875rem; font-size:0.875rem; margin-bottom:1.5rem; text-align:center;">
          Se esse email estiver cadastrado, você receberá as instruções em breve.
        </div>
        <div style="text-align:center;">
          <a href="/login" style="color:var(--accent); font-size:0.875rem;">← Voltar ao login</a>
        </div>
      {% else %}
        <p style="font-size:0.875rem; color:var(--text-muted); margin-bottom:1.25rem;">
          Informe seu email e enviaremos as instruções para redefinir sua senha.
        </p>

        <form method="post" action="/esqueci-senha">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
              autocomplete="email"
            >
          </div>

          <div style="margin-top:1.25rem;">
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
              Enviar instruções
            </button>
          </div>
        </form>

        <div style="text-align:center; margin-top:1.25rem; font-size:0.875rem;">
          <a href="/login" style="color:var(--accent);">← Voltar ao login</a>
        </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
