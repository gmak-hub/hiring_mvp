<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — HiringEval</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-logo">HiringEval</div>
      <p class="login-subtitle">Redefinir senha</p>

      {% if not valido %}
        <div style="background:#fee2e2; border:1px solid #fecaca; color:#dc2626; border-radius:6px; padding:0.875rem; font-size:0.875rem; margin-bottom:1.5rem; text-align:center;">
          Link inválido ou expirado. Solicite um novo link de recuperação.
        </div>
        <div style="text-align:center;">
          <a href="/esqueci-senha" style="color:var(--accent); font-size:0.875rem;">Solicitar novo link</a>
        </div>
      {% else %}
        {% if errors %}
          <div style="background:#fee2e2; border:1px solid #fecaca; color:#dc2626; border-radius:6px; padding:0.625rem 0.875rem; font-size:0.875rem; margin-bottom:1.25rem;">
            {% for e in errors %}
              <div>• {{ e }}</div>
            {% endfor %}
          </div>
        {% endif %}

        <form method="post" action="/redefinir-senha">
          <input type="hidden" name="token" value="{{ token }}">

          <div class="form-group">
            <label for="nova_senha">Nova senha</label>
            <input
              type="password"
              id="nova_senha"
              name="nova_senha"
              placeholder="••••••••"
              required
              autocomplete="new-password"
            >
          </div>

          <div class="form-group">
            <label for="confirmar_nova_senha">Confirmar nova senha</label>
            <input
              type="password"
              id="confirmar_nova_senha"
              name="confirmar_nova_senha"
              placeholder="••••••••"
              required
              autocomplete="new-password"
            >
          </div>

          <p style="font-size:0.75rem; color:var(--text-muted); margin-top:-0.25rem; margin-bottom:1.25rem;">
            Mínimo 6 caracteres
          </p>

          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
            Redefinir senha
          </button>
        </form>
      {% endif %}
    </div>
  </div>
</body>
</html>
