{% extends "base.html" %}
{% block title %}Novo Cargo — HiringEval{% endblock %}

{% block content %}
<a href="/" class="back-link">← Voltar aos Cargos</a>

<div class="page-header">
  <h1>Novo Cargo</h1>
</div>

<form method="post" action="/cargos" class="form">
  <div class="form-group">
    <label for="name">Nome do Cargo</label>
    <input type="text" id="name" name="name" required
      placeholder="Ex: Gerente de Engenharia, Analista de Produto, Coordenador Comercial...">
  </div>
  <div class="form-group">
    <label for="description">Descrição da Vaga</label>
    <textarea id="description" name="description" rows="14" required
      placeholder="Descreva em detalhes: responsabilidades principais, requisitos técnicos, senioridade esperada, contexto da equipe, principais desafios do cargo. Quanto mais detalhada a descrição, mais preciso será o scorecard gerado."></textarea>
  </div>
  <div class="form-actions">
    <a href="/" class="btn btn-ghost">Cancelar</a>
    <button type="submit" class="btn btn-primary">Criar Cargo</button>
  </div>
</form>
{% endblock %}
